# Cada media hora mira si hay corrida nueva del WRF (SMN) o del ICON (DWD); si la hay, arma las imágenes y las publica
# en GitHub Pages (queda solo la última corrida). Si algo falla, GitHub manda el mail de «run failed».
name: Pronóstico

on:
  schedule:
    - cron: "10,40 * * * *" # lejos de la hora en punto: ahí GitHub saltea más corridas programadas
    - cron: "5 12 * * *" # una vez por día: si la última corrida del WRF tiene más de 18 h, falla para que llegue el mail
  workflow_dispatch:
    inputs:
      forzar:
        description: Armar aunque las corridas sean las ya publicadas
        type: boolean
        default: false

concurrency:
  group: pronostico
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      cambio: ${{ steps.ver.outputs.cambio }}
      wrf: ${{ steps.ver.outputs.wrf }}
      icon: ${{ steps.ver.outputs.icon }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: python3 pronostico.py ver "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/meta.json" ${{ inputs.forzar && '--forzar' || '' }} >> "$GITHUB_OUTPUT"
      # GitHub apaga los horarios de un repo público después de 60 días sin actividad: esto lo vuelve a habilitar.
      - name: Mantener el horario
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pronostico.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Avisar si la corrida está vieja
        if: github.event.schedule == '5 12 * * *' && steps.ver.outputs.viejo == '1'
        run: |
          echo "::error::La última corrida del WRF tiene más de 18 h (o no se encontró): la página oculta el pronóstico."
          exit 1

  armar:
    needs: ver
    if: needs.ver.outputs.cambio == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas (si fallan, no se publica)
        run: python -m unittest discover -s tests
      - id: armar
        run: python pronostico.py armar sitio --wrf "${{ needs.ver.outputs.wrf }}" --icon "${{ needs.ver.outputs.icon }}" --antes "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/meta.json"
      # Con un archivo del SMN a medio subir, armar termina bien pero sin publicar: queda lo anterior.
      - if: steps.armar.outputs.listo == '1'
        run: cp README.md sitio/
      - if: steps.armar.outputs.listo == '1'
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
      - id: publicar
        if: steps.armar.outputs.listo == '1'
        uses: actions/deploy-pages@v5

  # Cada vuelta suma a la planilla acierto.csv (rama «datos», fuera del historial del código) las horas terminadas:
  # cuánto coincidió la lluvia del WRF con la del radar. La página la lee de raw.githubusercontent.com.
  medir:
    if: github.event.schedule != '5 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: datos
          path: datos
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pronostico.py medir datos/acierto.csv
      - name: Guardar la planilla
        working-directory: datos
        run: |
          git add acierto.csv
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Acierto del pronóstico hasta la hora $(tail -n 1 acierto.csv | cut -d, -f1) UTC"
          git push -q
