# Cada 10 minutos guarda en la rama «rma19» las imágenes nuevas del radar del SMN en Santa Rosa (RMA19): el repuesto
# de Radar Mendoza. Se miden 2 semanas (desde el 09/11/2026) para ver cuántas da y si acuerda con Contingencias.
name: RMA19

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *" # lejos de la hora en punto y de la media: ahí GitHub saltea más corridas
  workflow_dispatch:

concurrency:
  group: rma19
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # Para apagarse solo al terminar la medición

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # La medición dura 2 semanas: desde el 24/11 00:00 de Mendoza (03:00 UTC) la Action se apaga sola. Para seguir,
      # cambiar la fecha y volver a prenderla (gh workflow enable rma19.yml)
      - name: Fin de la medición
        id: fin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d%H)" -ge 2026112403 ]; then
            gh workflow disable rma19.yml -R "$GITHUB_REPOSITORY"
            echo "listo=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.fin.outputs.listo != '1'
      - uses: actions/checkout@v7
        if: steps.fin.outputs.listo != '1'
        with:
          ref: rma19
          path: rma19
      - run: bash rma19.sh rma19
        if: steps.fin.outputs.listo != '1'
      - name: Guardar las imágenes
        if: steps.fin.outputs.listo != '1'
        working-directory: rma19
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "RMA19 hasta $(tail -n 1 vueltas.csv | cut -d, -f3) (hora de Mendoza)"
          git push -q
